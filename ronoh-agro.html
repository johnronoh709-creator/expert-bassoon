<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Expert Bassoon">
    <meta property="og:description" content="Your go-to source for bassoon expertise.">
    <link rel="preconnect" href="https://example.com">
    <link rel="preconnect" href="https://another-resource.com">
    <title>Expert Bassoon</title>
</head>
<body>
    <header>
        <h1>Welcome to Expert Bassoon</h1>
    </header>
    <main>
        <section>
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required aria-label="Name">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required aria-label="Email">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required aria-label="Message"></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
        <section>
            <img src="path/to/image.jpg" loading="lazy" alt="Descriptive alt text for the image">
            <svg><!-- Complete SVG path for icons will go here --></svg>
        </section>
    </main>
    <script>
        document.getElementById('contact-form').onsubmit = function(e) {
            e.preventDefault();
            // Validate the form data here
            const emailInput = document.getElementById('email');
            if (emailInput.validity.typeMismatch) {
                alert('Please enter a valid email address.');
                return;
            }
            alert('Message sent!');
            setTimeout(() => { alert('Thank you for your message.'); }, 3000);
            // Reset form
            this.reset();
        };
    </script>
</body>
</html>
